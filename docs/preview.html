<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ship Radar card preview</title>
<style>
:root{--card-background-color:#fff;--primary-text-color:#1c2329;--secondary-text-color:#5b6770;--primary-color:#03a9f4;--divider-color:rgba(0,0,0,.14);color-scheme:light}
:root[data-theme=dark]{--card-background-color:#1c1f24;--primary-text-color:#e6e9ec;--secondary-text-color:#9aa4ad;--divider-color:rgba(255,255,255,.16);color-scheme:dark}
body{margin:0;padding:24px;font-family:Roboto,system-ui,sans-serif;background:#e8ecef;color:var(--primary-text-color)}
:root[data-theme=dark] body{background:#111418}
.bar{max-width:640px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--divider-color);background:var(--card-background-color);color:inherit;cursor:pointer}
ship-radar-card{display:block;max-width:640px;margin:0 auto}
ha-card{display:block;background:var(--card-background-color);color:var(--primary-text-color);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
</style></head><body>
<div class="bar"><span>Mock data, fictional vessels. Tap a ship.</span><button id="t">Dark / light</button></div>
<ship-radar-card id="c"></ship-radar-card>
<script src="../dist/ship-radar-card.js"></script>
